name: brl1p-signers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  signers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pycryptodome && python3 2026-11-brl1p-monitor/signers.py
      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add 2026-11-brl1p-monitor
          git commit -m "brl1p-signers run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
