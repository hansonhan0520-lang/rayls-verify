name: brl1p-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p 2026-11-brl1p-monitor/results && python3 2026-11-brl1p-monitor/probe.py | tee 2026-11-brl1p-monitor/results/probe-$(date -u +%Y%m%dT%H%MZ).log
      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add 2026-11-brl1p-monitor/results
          git commit -m "probe results" && git pull --rebase && git push
