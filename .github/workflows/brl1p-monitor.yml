name: brl1p-monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency:
  group: brl1p-monitor
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: rebuild the bridge history and read live state
        run: python3 2026-11-brl1p-monitor/collect.py
      - name: rerun the October script unchanged
        if: always()
        continue-on-error: true
        run: |
          mkdir -p 2026-11-brl1p-monitor/runs
          timeout 600 node 2026-10-brl1p-backing/verify-brl1p.js > 2026-11-brl1p-monitor/runs/$(date -u +%Y-%m-%dT%H%MZ)-verify-brl1p.log 2>&1
      - name: fetch BRL1 proof-of-reserves documents
        if: always()
        continue-on-error: true
        run: python3 2026-11-brl1p-monitor/por.py
      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add 2026-11-brl1p-monitor
          git commit -m "brl1p-monitor run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
